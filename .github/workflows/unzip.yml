name: Extract V2 source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unzip.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/v2
          unzip -o DICHUAONLINE-V2-CLOUD.zip -d /tmp/v2
          cp -a /tmp/v2/DICHUAONLINE-V2/. .

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract DICHUAONLINE V2 source"
            git push
          fi
