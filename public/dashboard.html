<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Đi Chùa V2</title><link rel="stylesheet" href="/style.css"></head><body><header><span>🎛️ DASHBOARD V2</span><nav><a href="/">Xem chùa</a></nav></header><main class="dash"><div class="panel"><h2>🔐 Quản trị</h2><label>Mật khẩu quản trị (ADMIN_PASSWORD)</label><input id="password" type="password" autocomplete="off" placeholder="Nhập mật khẩu"><p class="note">Mật khẩu chỉ lưu trong phiên trang này, không lưu trên máy.</p></div><div class="panel"><h2>🎁 Kích hoạt sự kiện thử</h2><label>Tên nhân vật</label><input id="name" maxlength="32" placeholder="Ví dụ: Khách An Nhiên"><label>Loại hiệu ứng</label><select id="kind"><option value="lotus">🌸 Hoa sen · 1 điểm</option><option value="bell">🔔 Chuông · 3 điểm</option><option value="light">✨ Ánh sáng · 5 điểm</option><option value="fireworks">🎆 Pháo hoa · 10 điểm</option></select><button id="send">Phát sự kiện</button><p id="status" role="status"></p></div><div class="panel"><h2>⚙️ Cấu hình trực tiếp</h2><label class="check"><input id="night" type="checkbox" checked> Chế độ đêm</label><label class="check"><input id="particles" type="checkbox" checked> Hạt sáng bay</label><label class="check"><input id="sound" type="checkbox"> Âm thanh (cần bật trên trang xem)</label><button id="settings">Lưu cấu hình</button><button id="reset" class="danger">Xóa bảng điểm thử</button></div><div class="panel"><h2>📡 Trạng thái</h2><p id="connection">Đang kết nối...</p><p id="uptime"></p><p>Điểm cao nhất: <strong id="top">—</strong></p></div></main><script src="/dashboard.js"></script></body></html>
